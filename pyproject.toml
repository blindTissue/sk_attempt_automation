[project]
name = "djclips"
version = "0.1.0"
description = "Cut Instagram-ready videos of every transition in a DJ mix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[project.scripts]
djclips = "djclips.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
